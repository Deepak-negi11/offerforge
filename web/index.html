<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interview questions asked at Amazon, Google, Microsoft and 25 more companies, by round and by track (internship or full-time), each linked to the post it came from." />
    <meta name="theme-color" content="#050505" />

      document.documentElement.dataset.theme = 'dark';
      try {
        var t = localStorage.getItem('atlas:theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
