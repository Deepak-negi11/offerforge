[project]
name = "interview-atlas-scraper"
version = "0.1.0"
description = "Discover, fetch, extract and normalize sourced interview questions for Interview Atlas"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.7",
  "httpx>=0.27",
  "selectolax>=0.3",
  "markdownify>=0.13",
  "pydantic>=2.7",
  "anthropic>=0.60",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[tool.uv]
package = false
