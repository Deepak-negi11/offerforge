# Render Blueprint: free web service. Accounts and progress live in a Turso database
# (Render's free plan has no persistent disk). Set the two TURSO_* values in the Render dashboard.
services:
  - type: web
    name: offerforge
    runtime: node
    plan: free
    region: virginia  # same AWS region as the Turso database (us-east-1)
    buildCommand: npm --prefix web ci --include=dev && npm --prefix web run build && npm --prefix server ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    domains:
      - offerforge.orbit8.tech  # CNAME offerforge -> offerforge-cygc.onrender.com at get.tech
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # PostHog analytics: the project API key (phc_..., public) is baked into the web build.
      # Leave it unset to turn analytics off. POSTHOG_REGION is "us" or "eu", matching the PostHog project.
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: POSTHOG_REGION
        value: us
