# Render Blueprint: free web service. Accounts and progress live in a Turso database
# (Render's free plan has no persistent disk). Set the two TURSO_* values in the Render dashboard.
services:
  - type: web
    name: offerforge
    runtime: node
    plan: free
    region: virginia  # same AWS region as the Turso database (us-east-1)
    buildCommand: npm --prefix web ci && npm --prefix web run build && npm --prefix server ci --omit=dev
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
