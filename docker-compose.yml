# Optional: self-hosted code runner for C++ and Java (JavaScript and Python run in the browser).
#   docker compose up -d piston && ./scripts/setup-runner.sh
#   then start the API with PISTON_URL=http://localhost:2000
services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true # Piston uses isolate (cgroups) to sandbox each run
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston-packages:/piston/packages
    tmpfs:
      - /piston/jobs:exec,uid=1000,gid=1000,mode=711
volumes:
  piston-packages:
